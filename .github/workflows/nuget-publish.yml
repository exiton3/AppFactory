name: Release Package Version
on:
  push:
    tags:
      - "v*.*.*"  # Only trigger on semantic version tags (v10.1.0, v10.2.0-beta, etc.)

jobs:
  unit_tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test --no-restore --verbosity normal --filter "Category!=Acceptance"

  discover_projects:
    runs-on: ubuntu-22.04
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover packable projects
        id: discover
        run: |
          mapfile -t projects < <(
            find ./src -mindepth 2 -maxdepth 2 -name "*.csproj" -printf "%f\n" \
              | sed 's/\.csproj$//' \
              | grep '^AppFactory\.Framework\.' \
              | sort
          )

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No projects found to publish."
            exit 1
          fi

          json=$(printf '%s\n' "${projects[@]}" | jq -R . | jq -sc .)
          echo "projects=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered projects: $json"

  deploy:
    needs:
      - unit_tests
      - discover_projects
    if: github.event.base_ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write  # Required for OIDC authentication with NuGet
      contents: read
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover_projects.outputs.projects) }}

    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build all projects first to ensure project references are resolved correctly
      - name: Restore all dependencies
        run: dotnet restore

      - name: Build all projects
        run: dotnet build --configuration Release --no-restore

      # Pack the specific project (use --no-build to use already built assemblies)
      - name: Pack ${{ matrix.project }}       
        run: |
          dotnet pack ./src/${{ matrix.project }}/${{ matrix.project }}.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion='${{ steps.version.outputs.version }}' \
            --output packages

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}
  
      - name: Publish ${{ matrix.project }} package
        run: |
          dotnet nuget push packages/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source 'https://api.nuget.org/v3/index.json' \
            --skip-duplicate

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}.v${{ steps.version.outputs.version }}
          path: packages/
          retention-days: 30
